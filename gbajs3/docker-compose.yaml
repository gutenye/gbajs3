services:
    gba-webserver:
        image: ${REGISTRY_PREFIX}gba-webserver
        logging:
            options:
                max-size: '20m'
                max-file: '3'
            driver: json-file
        build:
            context: ${SERVICE_GBAJS3:-.}
            args:
                CLIENT_HOST: ${CLIENT_HOST}
                RELEASE_VERSION: ${RELEASE_VERSION}
            x-bake:
                platforms:
                    - linux/arm64
                    - linux/amd64
        ports:
            - 3000:443
        environment:
            - CLIENT_HOST=${CLIENT_HOST}
        volumes:
            - ${CERT_LOC}:/certs/fullchain.pem
            - ${KEY_LOC}:/certs/privkey.pem